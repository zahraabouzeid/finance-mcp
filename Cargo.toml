[package]
name = "finance-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4.6", features = ["derive", "env"] }
rmcp = { version = "3.4", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "signal"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false }
rmcp = { version = "3.4", features = ["client", "transport-streamable-http-client-reqwest"] }
tokio = { version = "1.53", features = ["time"] }
